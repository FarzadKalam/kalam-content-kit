name: content-kit-zip
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        env:
          HYPERFRAMES_SKIP_SKILLS: '1'
          HYPERFRAMES_NO_TELEMETRY: '1'
          HYPERFRAMES_NO_UPDATE_CHECK: '1'
      - run: npm test
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: kalam-content-kit
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$KIT_TAG" dist/*.zip --title "$KIT_TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_TAG: ${{ github.ref_name }}
